<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khushali &amp; Stavan – Wedding Invitation &amp; RSVP</title>
<meta name="description" content="You are invited to the wedding of Khushali and Stavan. Please RSVP.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ivory:#f6f5ee;--gold:#b8922a;--bark:#5e4435;--ink:#3d2e26;--lav:#a7a3cc;--line:#e3d9c6;color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ivory);color:var(--ink);font:400 1rem/1.65 Jost,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.invite{max-width:620px;margin:0 auto;padding:clamp(10px,3vw,36px) clamp(0px,3vw,24px) 0;text-align:center}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:6px;box-shadow:0 20px 50px -22px rgba(94,68,53,.4);background:#fffdf8}
.slides::-webkit-scrollbar{display:none}
.slides>*{flex:0 0 100%;width:100%;height:auto;display:block;scroll-snap-align:center}
.slides iframe{border:0;aspect-ratio:3/4}
.nav{display:flex;align-items:center;justify-content:center;gap:1rem;margin-top:1rem}
.nav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fffdf8;color:var(--bark);font-size:1.5rem;line-height:1;cursor:pointer}
.nav button:hover{background:#f1ebdc}
.nav span{min-width:4.5rem;font-size:.95rem;color:#6f5a4d}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.slides{scroll-behavior:auto}}
.links{display:flex;gap:1.4rem;justify-content:center;flex-wrap:wrap;margin-top:1.1rem;font-size:.95rem}
a{color:var(--bark);text-underline-offset:4px}
.rule{width:64px;height:1px;background:var(--gold);margin:clamp(36px,7vw,72px) auto 0;border:0}
.rsvp{max-width:720px;margin:clamp(28px,5vw,48px) auto clamp(40px,8vw,80px);padding:0 clamp(12px,4vw,24px)}
.card{background:#fffdf8;border:1px solid var(--line);border-radius:22px;padding:clamp(22px,5vw,44px);text-align:center}
h2{font:600 clamp(2.1rem,7vw,3.2rem)/1.08 "Cormorant Garamond",Georgia,serif;margin:0 0 .6rem;color:var(--bark)}
.lead{max-width:46ch;margin:0 auto 1.5rem;color:#6f5a4d}
.btn{display:inline-block;background:var(--bark);color:#fffdf8;padding:.8rem 1.6rem;border-radius:999px;text-decoration:none;font-weight:500}
.btn:hover{background:#4a3428}
a:focus-visible,.btn:focus-visible,iframe:focus-visible{outline:3px solid var(--lav);outline-offset:3px}
iframe{display:block;width:100%;height:1100px;border:0;margin-top:1.6rem;border-radius:12px;background:#fff}
.hint{font-size:.88rem;color:#8a7466;margin:.9rem 0 0}
footer{text-align:center;padding:0 16px 40px;font:500 1.15rem "Cormorant Garamond",Georgia,serif;color:var(--bark)}
</style>
</head>

<script>
// Invitation source (use ONE). Leave both empty to show the three built-in invitation pages.
// A) Canva pages exported as images (Share > Download > JPG/PNG, all pages), saved in a "slides" folder:
const SLIDES = [];   // e.g. ["slides/1.jpg", "slides/2.jpg", "slides/3.jpg"]
// B) Canva VIEW-ONLY link (Share > "Public view link"), ending in /view. Never an /edit link.
const CANVA_VIEW_LINK = "";

const track = document.getElementById("slides");
if (SLIDES.length) {
  track.innerHTML = "";
  SLIDES.forEach((s, i) => { const im = new Image(); im.src = s; im.alt = "Invitation slide " + (i + 1) + " of " + SLIDES.length; im.loading = i ? "lazy" : "eager"; track.appendChild(im); });
} else if (/^https:\/\/www\.canva\.com\/design\/[\w-]+\/[\w-]+\/(view|watch)/.test(CANVA_VIEW_LINK)) {
  track.innerHTML = "";
  const u = new URL(CANVA_VIEW_LINK); u.search = "?embed";
  const f = document.createElement("iframe");
  f.src = u.toString(); f.title = "Wedding invitation of Khushali and Stavan"; f.allowFullscreen = true;
  track.appendChild(f);
}
const total = track.children.length, nav = document.getElementById("nav"), count = document.getElementById("count");
if (total > 1) {
  nav.hidden = false;
  const show = () => { count.textContent = (Math.round(track.scrollLeft / track.clientWidth) + 1) + " of " + total; };
  track.addEventListener("scroll", show, { passive: true }); show();
  document.getElementById("prev").onclick = () => track.scrollBy({ left: -track.clientWidth, behavior: "smooth" });
  document.getElementById("next").onclick = () => track.scrollBy({ left: track.clientWidth, behavior: "smooth" });
}

// RSVP buttons open this Google Form.
const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSeLHUboCqgK_ooGBvEEOlh2qVj7Gg_bbimff7yHWXvD_6puWg/viewform?usp=publish-editor";
document.querySelectorAll("[data-rsvp]").forEach(a => { a.href = FORM_URL; });
</script>
